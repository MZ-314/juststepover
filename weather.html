<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather — JustStepover</title>
  <meta name="description" content="Search weather for football cities worldwide on JustStepover.">
  <script>(function(){var t=localStorage.getItem('jso-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <script src="js/config.js"></script>
</head>
<body data-page="weather">

<div id="site-header"></div>

<main>
  <div class="page-wrap">
    <header class="page-hero-band">
      <div class="section-hd"></div>
      <span class="section-hd-label">Weather</span>
      <h1>World Football Weather</h1>
      <p>Search any city — match-day conditions, travel, and kick-off forecasts from cities across every continent.</p>
    </header>

    <div class="weather-page-search-wrap">
      <svg class="weather-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" class="weather-search-input" id="weatherSearchInput" placeholder="Search city (e.g. Manchester, Tokyo, São Paulo)…" autocomplete="off" aria-label="Search for a city">
      <div class="weather-search-results" id="weatherSearchResults" role="listbox"></div>
    </div>

    <div id="weather-api-notice" class="weather-api-notice" hidden></div>

    <div class="weather-grid" id="weather-grid">
      <div class="loading"><div class="loading-spinner"></div>Loading weather…</div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/main.js"></script>
</body>
</html>
