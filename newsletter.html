<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter — JustStepover</title>
  <meta name="description" content="Subscribe to the JustStepover weekly newsletter.">
  <script>(function(){var t=localStorage.getItem('jso-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <script src="js/config.js"></script>
</head>
<body data-page="newsletter">

<div id="site-header"></div>

<main>
  <div class="page-wrap">
    <header class="page-hero-band">
      <div class="section-hd"></div>
      <span class="section-hd-label">Newsletter</span>
    </header>
    <section class="newsletter-page">
      <h1 class="newsletter-title" style="font-family:var(--font-condensed);font-size:clamp(28px,5vw,36px);font-weight:800;text-transform:uppercase;margin-bottom:8px;">Get JustStepover in your inbox</h1>
      <p class="newsletter-sub">Our weekly digest: new articles, sharp takes, and the stories worth your time. No spam, no filler.</p>
      <form class="newsletter-page-form" id="newsletterPageForm">
        <input type="text" name="name" placeholder="Your name" required autocomplete="name">
        <input type="email" name="email" placeholder="your@email.com" required autocomplete="email">
        <button type="submit">Subscribe — it's free</button>
      </form>
      <p style="font-family:var(--font-ui);font-size:12px;color:var(--ink-faint);margin-top:20px;line-height:1.5;">
        You can unsubscribe anytime. We respect your inbox as much as we respect the game.
      </p>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/main.js"></script>
</body>
</html>
